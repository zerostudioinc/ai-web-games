<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Maze Runner</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1d2a; overflow: hidden; }
      #game { width: 100vw; height: 100vh; touch-action: none; }
      #rotate-hint {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; text-align: center;
        background: #0b1d2a; color: #e8f4f8; font: 24px sans-serif;
      }
      @media (orientation: portrait) { #rotate-hint { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">Rotate your device to landscape</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
